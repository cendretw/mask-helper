<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: "Microsoft JhengHei", sans-serif; width: 275px; padding: 15px; background-color: #f9f9f9; margin: 0; }
    h3 { margin-top: 0; color: #222; border-bottom: 2px solid #0078D7; padding-bottom: 8px; }
    .box { background: white; padding: 10px; border-radius: 6px; border: 1px solid #e0e0e0; margin-bottom: 12px; }
    .box-title { font-size: 13px; font-weight: bold; color: #0078D7; margin-bottom: 6px; }
    label { font-size: 12px; color: #555; display: block; margin-top: 6px; }
    input, select, button { width: 100%; padding: 8px; margin-top: 6px; border-radius: 5px; font-size: 13px; box-sizing: border-box; }
    input, select { border: 1px solid #ccc; }
    button { border: none; cursor: pointer; font-weight: bold; color: white; }
    #openPdfWorkspaceBtn { background-color: #6A1B9A; font-size: 14px; padding: 10px; }
    #captureBtn { background-color: #E65100; font-size: 14px; padding: 10px; }
    #scanBtn { background-color: #0078D7; }
    #maskBtn { background-color: #2E7D32; }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <h3>🕵️ 個資遮蔽小幫手 3.0</h3>

  <div class="box">
    <div class="box-title">📂 模式一：PDF 文件與圖片打碼</div>
    <button id="openPdfWorkspaceBtn">📄 開啟 PDF / 圖片遮蔽工作台</button>
    <button id="captureBtn">📸 擷取目前畫面（試算表/網頁）</button>
  </div>

  <div class="box">
    <div class="box-title">🌐 模式二：一般網頁自動掃描</div>
    <label>額外指定要抓的字（用逗號隔開）：</label>
    <input type="text" id="customWords" placeholder="例如：三年二班,王大明">
    
    <label style="margin-top: 8px;">
      <input type="checkbox" id="detectNames" checked style="width: auto; margin-right: 4px;">自動偵測常見中文姓名
    </label>

    <button id="scanBtn">1. 掃描網頁個資</button>

    <label>選擇遮蔽方式：</label>
    <select id="maskStyle">
      <option value="blur">馬賽克霧化</option>
      <option value="star">變成星號 (***)</option>
      <option value="circle">變成圈圈 (OOO)</option>
    </select>
    <button id="maskBtn">2. 執行網頁遮蔽</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
